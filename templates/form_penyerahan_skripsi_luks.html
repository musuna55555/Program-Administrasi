<!doctype html>
<html>
  <head>
    <title>Penyerahan Skripsi Lux</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <div class="card shadow p-4">
        <h3 class="mb-4 text-center">Form Penyerahan Skripsi</h3>

        <form action="/submit" method="POST">
          <input
            type="hidden"
            name="keperluan"
            value="Surat Penyerahan Skripsi Lux"
          />

          <div class="row">
            <div class="col-md-6">
              <label>Nama</label>
              <input class="form-control mb-3" name="nama" />

              <label>NPM</label>
              <input class="form-control mb-3" name="npm" />

              <label>Fakultas</label>
              <input class="form-control mb-3" name="fakultas" />

              <label>Program Studi</label>
              <input class="form-control mb-3" name="prodi" />

              <label>Judul Skripsi</label>
              <textarea class="form-control mb-3" name="judul"></textarea>
            </div>

            <div class="col-md-6">
              <label>Dosen Pembimbing</label>
              <input class="form-control mb-3" name="doping" />

              <label>Dosen Penguji 1</label>
              <input class="form-control mb-3" name="doji1" />

              <label>Dosen Penguji 2</label>
              <input class="form-control mb-3" name="doji2" />

              <label>Tanggal Sidang</label>
              <input class="form-control mb-3" name="tglsidang" />
            </div>
          </div>

          <div class="text-center mt-3">
            <button class="btn btn-danger px-5">Kirim</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
