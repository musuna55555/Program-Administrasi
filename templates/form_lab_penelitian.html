<!DOCTYPE html>
<html>
<head>
    <title>Permohonan Lab Penelitian</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">
        <h3 class="mb-4 text-center">Form Permohonan Laboratorium Penelitian</h3>

        <form action="/submit" method="POST">
            <input type="hidden" name="keperluan" value="Lab Penelitian">

            <div class="row">
                <div class="col-md-6">
                    <label>Nama</label>
                    <input class="form-control mb-3" name="nama">

                    <label>NPM</label>
                    <input class="form-control mb-3" name="npm">

                    <label>Fakultas</label>
                    <input class="form-control mb-3" name="fakultas">
                </div>

                <div class="col-md-6">
                    <label>Program Studi</label>
                    <input class="form-control mb-3" name="prodi">

                    <label>Jenjang Pendidikan</label>
                    <input class="form-control mb-3" name="jp">
                </div>
            </div>

            <div class="text-center mt-3">
                <button class="btn btn-danger px-5">Kirim</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
