<!doctype html>
<html>
  <head>
    <title>Surat Aktif Kuliah</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <div class="card shadow p-4">
        <h3 class="mb-4 text-center">Form Surat Aktif Kuliah</h3>

        <form action="/submit" method="POST">
          <input type="hidden" name="keperluan" value="Aktif Kuliah" />

          <div class="row">
            <div class="col-md-6">
              <label>Nama</label>
              <input class="form-control mb-3" name="nama" />

              <label>Tempat / Tanggal Lahir</label>
              <input class="form-control mb-3" name="ttl" />

              <label>Jenis Kelamin</label>
              <select class="form-control mb-3" name="jk">
                <option value="">-- Pilih --</option>
                <option>Laki-laki</option>
                <option>Perempuan</option>
              </select>

              <label>NPM</label>
              <input class="form-control mb-3" name="npm" />

              <label>Semester</label>
              <input class="form-control mb-3" name="sem" />
            </div>

            <div class="col-md-6">
              <label>Jurusan</label>
              <input class="form-control mb-3" name="jurusan" />

              <label>Program Studi</label>
              <input class="form-control mb-3" name="prodi" />

              <label>Jenjang Pendidikan</label>
              <input class="form-control mb-3" name="jp" />

              <label>Alamat Mahasiswa</label>
              <textarea class="form-control mb-3" name="alamatmaha"></textarea>

              <label>Nama Orang Tua</label>
              <input class="form-control mb-3" name="namaortu" />

              <label>Pekerjaan Orang Tua</label>
              <input class="form-control mb-3" name="pekerortu" />

              <label>Alamat Orang Tua</label>
              <textarea class="form-control mb-3" name="alamatortu"></textarea>
            </div>
          </div>

          <div class="text-center mt-3">
            <button class="btn btn-primary px-5">Kirim</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
