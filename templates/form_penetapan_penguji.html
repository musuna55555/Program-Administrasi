<!doctype html>
<html>
  <head>
    <title>Penetapan penguji seminar Formulir Undangan semhas penelitian</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <div class="card shadow p-4">
        <h3 class="mb-4 text-center">
          Form Penetapan penguji seminar Formulir Undangan semhas penelitian
        </h3>

        <form action="/submit" method="POST">
          <input
            type="hidden"
            name="keperluan"
            value="Penetapan penguji seminar, Formulir, Undangan semhas penelitian"
          />

          <div class="row">
            <div class="col-md-6">
              <label>Nama</label>
              <input class="form-control mb-3" name="nama" />

              <label>NPM</label>
              <input class="form-control mb-3" name="npm" />

              <label>No HP/Wa</label>
              <input class="form-control mb-3" name="wa" />

              <label>Hari</label>
              <input class="form-control mb-3" name="hari" />

              <label>Tanggal</label>
              <input class="form-control mb-3" name="tgl" />

              <label>Jam</label>
              <input class="form-control mb-3" name="jam" />

              <label>Tempat</label>
              <input class="form-control mb-3" name="tempat" />
            </div>

            <div class="col-md-6">
              <label>Judul</label>
              <textarea class="form-control mb-3" name="judul"></textarea>

              <label>Sifat</label>
              <input class="form-control mb-3" name="sifat" />

              <label>Dosen Pembimbing</label>
              <input class="form-control mb-3" name="doping" />

              <label>Dosen Penguji 1</label>
              <input class="form-control mb-3" name="doji1" />

              <label>Dosen Penguji 2</label>
              <input class="form-control mb-3" name="doji2" />
            </div>
          </div>

          <div class="text-center mt-3">
            <button class="btn btn-success px-5">Kirim</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
